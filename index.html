.logo{display:inline-block;background:#fff;border-radius:20px;padding:14px 20px;margin:0 auto 14px;box-shadow:0 0 0 4px rgba(224,185,79,.85),0 8px 24px rgba(0,0,0,.25)}
.logo img{width:118px;height:auto;display:block}
h1{font-size:1.55rem;margin:0;letter-spacing:.2px;text-shadow:0 2px 8px rgba(0,0,0,.5)}.tag{margin:4px 0 0;font-size:.95rem;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.pill{display:inline-block;margin-top:12px;padding:4px 12px;border-radius:99px;background:rgba(0,0,0,.38);font-size:.8rem}
main{max-width:760px;margin:-58px auto 0;padding:0 16px 40px;position:relative}
.saldo{background:var(--cd);border:1px solid var(--bd);border-top:4px solid var(--au);border-radius:18px;padding:20px;box-shadow:var(--sh);text-align:center;margin-bottom:14px}
.saldo small{color:var(--mu)}.saldo b{display:block;font-size:2.2rem;line-height:1.2;color:var(--g);margin:2px 0}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:var(--sh);display:flex;gap:10px;align-items:center}
.ic{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#fff}
.in .ic{background:var(--g2)}.out .ic{background:var(--r)}
.c small{color:var(--mu);display:block;line-height:1.2}.c b{font-size:1.05rem}.in b{color:var(--g)}.out b{color:var(--r)}
.split{height:8px;border-radius:4px;background:var(--r);overflow:hidden;margin-bottom:6px}.split i{display:block;height:100%;background:var(--g)}
.lg{display:flex;justify-content:space-between;color:var(--mu);font-size:.78rem;margin-bottom:20px}
.tabs{display:flex;gap:4px;padding:4px;background:var(--cd);border:1px solid var(--bd);border-radius:14px;margin-bottom:14px}
.tabs button{flex:1;padding:10px 4px;border:0;background:none;color:var(--mu);border-radius:10px;font:inherit;font-size:.92rem;cursor:pointer}
.tabs button.on{background:var(--g2);color:#fff;font-weight:600}
.it{background:var(--cd);border:1px solid var(--bd);border-left:4px solid var(--au);border-radius:14px;padding:12px 14px;margin-bottom:10px;box-shadow:var(--sh)}
.it .h{display:flex;justify-content:space-between;gap:8px;font-weight:600}.it .h span:first-child,li span:first-child{flex:1;min-width:0;overflow-wrap:anywhere}.it .h span:last-child,li span:last-child{white-space:nowrap}
.bar{height:8px;border-radius:4px;background:var(--bd);margin:8px 0}.bar i{display:block;height:100%;border-radius:4px;background:linear-gradient(90deg,#f59e0b,var(--r))}
.m{color:var(--mu);font-size:.85rem}
details summary{cursor:pointer;color:var(--g);font-size:.9rem;margin-top:4px}
li{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;padding:4px 0;border-bottom:1px dashed var(--bd);list-style:none}
ul{margin:6px 0 0;padding:0}.p{color:var(--g)}.q{color:var(--r)}

function csv(t){const r=[];let row=[],c='',q=false;for(let i=0;i<t.length;i++){const ch=t[i];if(q){if(ch=='"'&&t[i+1]=='"'){c+='"';i++}else if(ch=='"')q=false;else c+=ch}else if(ch=='"')q=true;else if(ch==','){row.push(c);c=''}else if(ch=='\n'){row.push(c);r.push(row);row=[];c=''}else if(ch!='\r')c+=ch}row.push(c);r.push(row);return r}
